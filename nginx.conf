server {
    listen 80;
    resolver 8.8.8.8 1.1.1.1 valid=30s ipv6=off;
    
    # Universal proxy: pass target URL as X-Proxy-Target header
    # Example: curl -H "X-Proxy-Target: https://api.speedy.bg/v1/client/contract/" http://proxy/
    location / {
        set $target $http_x_proxy_target;
        
        if ($target = "") {
            return 400 '{"error": "Missing X-Proxy-Target header"}';
        }
        
        proxy_pass $target;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_pass_request_headers on;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        
        # Remove the proxy header before forwarding
        proxy_set_header X-Proxy-Target "";
    }
}
