server {
    listen 80;
    resolver 8.8.8.8 valid=30s;
    
    # Universal proxy: pass target URL as X-Proxy-Target header
    # Example: curl -H "X-Proxy-Target: https://api.speedy.bg/v1/client/contract/" http://proxy/
    location / {
        set $target $http_x_proxy_target;
        
        if ($target = "") {
            return 400 '{"error": "Missing X-Proxy-Target header"}';
        }
        
        proxy_pass $target;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass_request_headers on;
        
        # Remove the proxy header before forwarding
        proxy_set_header X-Proxy-Target "";
    }
}
